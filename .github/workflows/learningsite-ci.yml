name: FKM Kompass CI

on:
  push:
    branches: [master]
    paths:
      - "projects/learningSite/**"
      - ".github/workflows/learningsite-ci.yml"
  pull_request:
    paths:
      - "projects/learningSite/**"
      - ".github/workflows/learningsite-ci.yml"

defaults:
  run:
    working-directory: projects/learningSite

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/learningSite/package-lock.json

      - run: npm ci

      - name: Generate route types
        # `LayoutProps<"/[lang]">`/`PageProps` are ambient types Next.js
        # writes to .next/types on build — a bare `tsc --noEmit` on a fresh
        # checkout (no .next/ yet) fails with "Cannot find name
        # 'LayoutProps'" without this, since Typecheck otherwise runs before
        # the Build step below ever creates it.
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Terminology lint
        run: npm run lint:terminology

      - name: Content validation
        run: npm run validate:content

      - name: Unit tests
        run: npm test -- --run

      - name: Build
        run: npm run build
